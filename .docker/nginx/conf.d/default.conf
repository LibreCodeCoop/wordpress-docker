server {
    listen 80;
    server_name nginx localhost;
    index index.php index.html index.htm;
    root /var/www/html;
    server_tokens off;
    # some security headers ( optional )
    add_header X-Frame-Options                   "SAMEORIGIN"     always;
    add_header X-XSS-Protection                  "1; mode=block"  always;
    add_header X-Content-Type-Options            "nosniff"        always;
    add_header X-Permitted-Cross-Domain-Policies "none"           always;
    add_header Referrer-Policy                   "no-referrer"    always;
    # Commented to solve problems when edit a theme using the default theme editor of WordPress
    #add_header Content-Security-Policy           "default-src * data: 'unsafe-eval' 'unsafe-inline'" always;
    add_header Strict-Transport-Security max-age=31536000;
    if (!-e $request_filename) {
        rewrite /wp-admin$ $scheme://$host$uri/ permanent;
        rewrite ^(/[^/]+)?(/wp-.*) $2 last;
        rewrite ^(/[^/]+)?(/.*.php) $2 last;
    }
    location / {
        try_files $uri $uri/ /index.php$is_args$args;
    }
    include /tmp/xmlrpc-hardening.conf;
    include /tmp/web-install.conf;
    location ~* ^/wp-content/uploads/.*\.php$ {
        deny all;
    }
    location ~* ^/wp-content/.*/vendor(-bin)?/.*\.php$ {
        deny all;
    }
    location ~ ^/(index|wp-login|wp-cron|wp-comments-post|wp-signup|wp-activate|wp-trackback|wp-links-opml)\.php$ {
        include /etc/nginx/snippets/php-fpm.conf;
    }
    location ~ ^/wp-admin/([^/]+|(network|user)/[^/]+)\.php$ {
        include /etc/nginx/snippets/php-fpm.conf;
    }
    location = /wp-includes/js/tinymce/wp-tinymce.php {
        include /etc/nginx/snippets/php-fpm.conf;
    }
    location ~* \.(php[0-9]?|phtml|phar|pht)(/|$) {
        return 404;
    }
    location ~ /\.(?!well-known/) {
        deny all;
    }
    location ~* \.(sql|bak|old|orig|save|swp|swo|log|sh|dist|lock|tar|tgz|gz|bz2|xz|7z|rar|wpress)$ {
        deny all;
    }
    location ~ "~$" {
        deny all;
    }
    location ~* "^(?!/wp-content/uploads/\d{4}/\d{2}/).*\.zip$" {
        deny all;
    }
    location ~* ^/wp-content/(debug\.log|updraft|ai1wm-backups|aiowps_backups|backups?[^/]*|upgrade|uploads/(wc-logs|woocommerce_uploads))(/|$) {
        deny all;
    }
    location ~* /(composer\.(json|lock)|package(-lock)?\.json|phpunit[^/]*\.xml(\.dist)?)$ {
        deny all;
    }
    location = /favicon.ico {
        log_not_found off;
        access_log off;
    }
    location = /favicon.svg {
        log_not_found off;
        access_log off;
    }
    location = /robots.txt {
        log_not_found off;
        access_log off;
        allow all;
    }
    location ~* \.(css|gif|ico|jpeg|jpg|js|png)$ {
        expires max;
        log_not_found off;
    }
    include /etc/nginx/server.d/*.conf;
}
