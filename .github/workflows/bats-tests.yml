name: Bats tests

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  bats-tests:
    name: Bats infrastructure tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Bats-core
        run: |
          sudo apt-get update
          sudo apt-get install --yes bats shellcheck
      - name: Run Bats tests
        run: bats tests/security
      - name: ShellCheck Bats helpers
        run: shellcheck tests/security/helpers/*.bash