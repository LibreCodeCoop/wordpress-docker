name: Docker WordPress Publish

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build-and-push:
    name: Build and push image
    runs-on: ubuntu-latest
    env:
      VERSION_WORDPRESS: "6.9"
      VERSION_PHP: "8.3"
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers
        id: docker-cache
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: wordpress-buildx-${{ github.sha }}
          restore-keys: |
            wordpress-buildx-

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build container image
        uses: docker/build-push-action@v6
        with:
          context: .docker/wordpress
          file: .docker/wordpress/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          build-args: |
            VERSION_WORDPRESS=${{ env.VERSION_WORDPRESS }}
            VERSION_PHP=${{ env.VERSION_PHP }}
          tags: |
            ghcr.io/librecodecoop/wordpress-docker:${{ github.sha }}
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new

      - name: Push container image
        if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .docker/wordpress
          file: .docker/wordpress/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION_WORDPRESS=${{ env.VERSION_WORDPRESS }}
            VERSION_PHP=${{ env.VERSION_PHP }}
          tags: |
            ghcr.io/librecodecoop/wordpress-docker:${{ github.sha }}
            ghcr.io/librecodecoop/wordpress-docker:latest
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new

      - name: Move cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

      - name: Save Docker cache
        if: steps.docker-cache.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: wordpress-buildx-${{ github.sha }}