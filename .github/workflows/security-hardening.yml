name: Security hardening

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  nginx-hardening:
    name: Nginx XML-RPC policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Bats-core
        run: |
          sudo apt-get update
          sudo apt-get install --yes bats shellcheck
      - name: Run security tests
        run: bats tests/security
      - name: ShellCheck security helpers
        run: shellcheck tests/security/helpers/*.bash
